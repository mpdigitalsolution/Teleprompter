<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GhostPrompter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M12 2A9 9 0 0 0 3 11c0 3.2 1.6 6 4 7.6V21a1 1 0 0 0 1.5.9L12 20l3.5 1.9A1 1 0 0 0 17 21v-2.4c2.4-1.6 4-4.4 4-7.6A9 9 0 0 0 12 2zm-3 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
      </svg>
      <span class="title">GhostPrompter</span>
    </div>
    <span class="status-pill" id="popup-status">Ready</span>
  </div>

  <div class="action-grid">
    <button class="btn-pip-pop" id="popup-btn-pip" title="Open PiP Mode: Float across ALL tabs, PowerPoint, Zoom, and Windows (Always-On-Top)">
      <span>📌</span> Open PiP Mode (Always-On-Top)
    </button>
  </div>
  <div style="text-align: center; font-size: 10px; color: #64748B; margin-top: -4px; margin-bottom: 12px;">
    💡 Tip: Press <kbd style="background: rgba(255, 255, 255, 0.08); padding: 1px 5px; border-radius: 4px; color: #94A3B8; font-family: monospace;">Alt + P</kbd> for in-tab HUD
  </div>

  <!-- Transparency Mode Presets -->
  <div class="section">
    <div class="section-title">Transparency Mode</div>
    <div class="preset-group">
      <button class="preset-btn active" id="pop-preset-solid" data-preset="solid">⬛ Solid 95%</button>
      <button class="preset-btn" id="pop-preset-dark" data-preset="dark">🌓 Dark 75%</button>
      <button class="preset-btn" id="pop-preset-glass" data-preset="glass">🪟 Glass 35%</button>
      <button class="preset-btn" id="pop-preset-clear" data-preset="clear">👻 Clear 0%</button>
    </div>
    <div class="row" style="margin-top: 6px;">
      <span class="label">Custom Opacity:</span>
      <input type="range" class="input-range" id="popup-range-opacity" min="0" max="1" step="0.05">
    </div>
  </div>

  <!-- Speed & Mode Section -->
  <div class="section">
    <div class="section-title">Speed & Script</div>
    <div class="row">
      <span class="label">Auto-Scroll Speed:</span>
      <div class="speed-control">
        <button class="btn-step" id="pop-btn-wpm-dec">-</button>
        <span class="wpm-display" id="pop-val-wpm">130 WPM</span>
        <button class="btn-step" id="pop-btn-wpm-inc">+</button>
      </div>
    </div>
    <div class="row">
      <input type="range" class="input-range full-width" id="popup-range-wpm" min="50" max="300" step="10">
    </div>
    <div class="row">
      <span class="label">Mode:</span>
      <select class="select" id="popup-select-mode">
        <option value="auto">Auto-Scroll (WPM)</option>
        <option value="manual">Manual (Keys/Buttons)</option>
        <option value="dual">Dual (Gaze + Speech)</option>
        <option value="gaze">Gaze Only</option>
        <option value="speech">Speech Sync</option>
      </select>
    </div>
    <div class="row">
      <span class="label">Script:</span>
      <select class="select" id="popup-select-script"></select>
    </div>
    <div class="row">
      <span class="label">Font Size:</span>
      <input type="range" class="input-range" id="popup-range-font" min="16" max="44" step="2">
    </div>
  </div>

  <div class="links">
    <button class="link-btn" id="link-all-tabs" title="Broadcast prompter to all open tabs">🚀 All Tabs</button>
    <button class="link-btn" id="link-studio">🎥 Studio Mode</button>
    <button class="link-btn" id="link-setup">⚙ Calibration</button>
  </div>

  <script src="../modules/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
