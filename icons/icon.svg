<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background Badge -->
  <rect width="128" height="128" rx="28" fill="#0A0B10" />
  
  <!-- Stealth HUD Frame -->
  <rect x="14" y="14" width="100" height="100" rx="16" fill="none" stroke="url(#ghostGrad)" stroke-width="2.5" opacity="0.6" stroke-dasharray="4 4" />
  
  <!-- Teleprompter / HUD Lines -->
  <line x1="28" y1="36" x2="100" y2="36" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  <line x1="28" y1="50" x2="86" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  
  <!-- Eye Contour (Gaze Tracking) -->
  <path d="M 28 82 Q 64 54 100 82 Q 64 110 28 82 Z" fill="#121524" stroke="url(#ghostGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Iris & Pupil -->
  <circle cx="64" cy="82" r="14" fill="#00F0FF" opacity="0.85" />
  <circle cx="64" cy="82" r="7" fill="#0A0B10" />
  <circle cx="67" cy="79" r="2.5" fill="#FFFFFF" />
  
  <!-- Camera indicator dot -->
  <circle cx="64" cy="22" r="3" fill="#FF0055" />
</svg>
